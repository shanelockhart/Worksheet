<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fitment Expert Assistant | Operators Logic</title>
    <meta name="description" content="AI fitment assistant for Fitment Expert by Operators Logic.">
    <meta name="theme-color" content="#0f172a">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3Cpath d='M16 7v6M16 19v6M7 16h6M19 16h6' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-text: #60a5fa;
            --font: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding-top: env(safe-area-inset-top, 0px);
        }
        @supports (height: 1dvh) {
            .app { height: 100dvh; }
        }

        /* Header */
        .topbar {
            flex: none;
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-mark {
            width: 32px;
            height: 32px;
            flex: none;
        }
        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }
        .brand-product {
            font-size: 16px;
            font-weight: 700;
        }
        .brand-parent {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* Assistant */
        .assistant {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .assistant-header {
            flex: none;
            padding: 8px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
        }
        .chat-frame {
            position: relative;
            flex: 1;
            min-height: 0;
            background: var(--surface);
        }
        .chat-status {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }
        .chat-status[hidden] {
            display: none;
        }
        .pickaxe-container {
            position: absolute;
            inset: 0;
        }
        .pickaxe-container > *,
        .pickaxe-container iframe {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
            border: 0;
        }

        /* Footer */
        .footer {
            flex: none;
            padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
            background: var(--bg);
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }
        .footer strong {
            font-weight: 600;
            color: var(--text);
        }

        @media (min-width: 768px) {
            .topbar { padding: 12px 24px; }
            .assistant-header { padding: 10px 24px; font-size: 15px; }
            .footer { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="#2563eb"/>
                    <circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-width="2.2"/>
                    <circle cx="16" cy="16" r="3" fill="#fff"/>
                    <path d="M16 7v6M16 19v6M7 16h6M19 16h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <div class="brand-text">
                    <span class="brand-product">Fitment Expert</span>
                    <span class="brand-parent">by Operators Logic</span>
                </div>
            </div>
        </header>

        <main class="assistant">
            <div class="assistant-header">Fitment Expert AI Assistant</div>
            <div class="chat-frame">
                <p class="chat-status" id="chat-status" role="status">Loading assistant&hellip;</p>
                <div class="pickaxe-container">
                    <!-- Pickaxe Bot Deployment -->
                    <div id="deployment-008cf251-6683-4ad7-a748-9b5de60ee594"></div>
                </div>
            </div>
        </main>

        <footer class="footer">
            &copy; <span id="current-year"></span> <strong>Operators Logic</strong> &middot; Fitment Expert
        </footer>
    </div>

    <script src="https://studio.pickaxe.co/api/embed/bundle.js" defer
            onerror="var s=document.getElementById('chat-status');s.hidden=false;s.textContent='The assistant could not be loaded. Check your connection and reload the page.';"></script>
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Hide the loading note as soon as the Pickaxe embed renders something
        (function () {
            var deployment = document.getElementById('deployment-008cf251-6683-4ad7-a748-9b5de60ee594');
            var status = document.getElementById('chat-status');
            new MutationObserver(function (_, observer) {
                if (deployment.childNodes.length) {
                    status.hidden = true;
                    observer.disconnect();
                }
            }).observe(deployment, { childList: true });
        })();
    </script>
</body>
</html>
